# Pull request checks for the Iris integration branch.
#
# Two checks, ordered cheapest first: a clean install, then a typecheck of every
# workspace. Both are free. Nothing here talks to Cloudflare, nothing here calls
# a model, and nothing here needs a secret — if this workflow ever requires a
# token, something has gone wrong (shared-01 decision 4).
#
# Deliberately not here yet:
#   - the test step. `npm test` from the root runs every workspace and exits
#     non-zero on failure, so it is ready to add; it is left out to keep this
#     first workflow small.
#   - the PR title convention check.
#   - any deploy step. Deploys stay manual. A deploy step in a pull request
#     workflow is how a pull request ends up shipping to production.
#
# This workflow reports; it does not yet gate. Until it is marked a required
# status check in the repository settings, a red run does not stop a merge.
name: CI

on:
  pull_request:
    branches:
      - dev-iris

# A new push to the same pull request cancels the run still in flight, rather
# than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 is not optional: the root package.json's `engines` field requires
      # it because the repository tests use `node:sqlite`. A runner on Node 20
      # fails those in a way that reads like a code problem.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci`, never `npm install`. It installs strictly from the lockfile and
      # fails when the lockfile and package.json disagree — and that failure is
      # the entire point of this step. `npm install` would quietly reconcile the
      # two and hide exactly the breakage this is here to catch.
      - name: Install
        run: npm ci

      # Typechecking runs from inside each workspace, not from the root, because
      # each carries its own tsconfig.json and the apps use
      # `moduleResolution: node`, which only resolves correctly from their own
      # directory. Discovered rather than listed, so a new engine is covered the
      # day its workspace lands instead of the day someone remembers this file.
      - name: Typecheck
        run: |
          set -euo pipefail
          failed=0
          for dir in apps/*/ packages/*/; do
            [ -f "${dir}tsconfig.json" ] || continue
            echo "::group::tsc --noEmit ${dir}"
            if (cd "$dir" && npx --no-install tsc --noEmit); then
              echo "ok: $dir"
            else
              echo "::error::typecheck failed in $dir"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
